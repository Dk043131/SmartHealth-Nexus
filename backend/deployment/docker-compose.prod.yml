version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: nexus_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: smarthealth_nexus
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: production_secure_pwd_9021
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin -d smarthealth_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: nexus_prod_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://nexus_admin:production_secure_pwd_9021@database:5432/smarthealth_nexus
      - PROJECT_NAME=SmartHealth Nexus
      - PROJECT_VERSION=1.0.4
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: nexus_prod_nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
